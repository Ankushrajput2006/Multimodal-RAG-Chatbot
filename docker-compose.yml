"""Docker compose configuration for RAG Chatbot."""
version: '3.8'

services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-rag-chatbot
    ports:
      - "8501:8501"  # Streamlit port
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=cpu
      - LOG_LEVEL=INFO
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
